name: Feature request
description: Suggest something Brain should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem does this solve?, description: Describe the situation, not the solution. }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would you like to happen? }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives you've considered }
